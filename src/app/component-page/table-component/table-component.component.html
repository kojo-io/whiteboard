<div class="flex flex-col h-full w-full overflow-auto">
  <h1 class="text-4xl w-full text-center">Table</h1>
  <div class="h-full flex w-full justify-center grow">
    <div class="container grid grid-cols-1 gap-4 h-full w-full">
      <div class="w-full">
        <sc-table
          #table
          [data]="data"
          [usePagination]="true"
          [showCurrentPageInfo]="true"
          [showPageLinks]="true"
          [currentPageSize]="10"
          currentPageInfoTemplate="Page {currentPage} of {totalPages}"
          [pageSizeOptions]="[10, 20, 30, 40]"
          [border]="true"
          [rounded]="true"
          [shadow]="true"
          paginationPosition="bottom-right">
          <thead Thead>
          <tr>
            <th Th>Name</th>
            <th Th>Email</th>
            <th Th>Phone Number</th>
          </tr>
          </thead>
          <tbody>
          <ng-container *ngFor="let item of table.mainData; let i = index">
            <tr Tr>
              <td Td>{{item.name}}</td>
              <td Td>{{item.email}}</td>
              <td Td>{{item.phone}}</td>
            </tr>
          </ng-container>
          </tbody>
        </sc-table>
      </div>
    </div>
  </div>

</div>
