<div class="flex flex-col h-full w-full overflow-auto">
  <h1 class="text-4xl w-full text-center">Input</h1>
  <div class="h-full flex w-full justify-center grow">
    <div class="container grid grid-cols-2 gap-4 h-full w-full">
      <div class="flex flex-col justify-center space-y-14 items-center">
        <div class="w-4/6 space-y-4">
          <div>
            <sc-select [(ngModel)]="selected" [displayTemplate]="sampleSelect" [template]="true" placeholder="Select" (ngModelChange)="getSelected($event)">
              <ng-template #sampleSelect>
                <div class="flex items-center space-x-[8px] w-full">
                  <i [ngClass]="displaySelected?.icon" class="leading-none ri-1x text-[#374151]"></i>
                  <span class="text-[14px] text-[#374151]">{{displaySelected?.title}}</span>
                </div>
              </ng-template>
              <sc-select-search (onChange)="filter($event)"></sc-select-search>
              <sc-select-option *ngFor="let item of list" [value]="item.id" [selected]="item.id === selected">
                <div class="px-[8px] py-[6px] cursor-pointer flex items-center space-x-[8px] w-full">
                  <i [ngClass]="item.icon" class="leading-[20px] text-[#374151]"></i>
                  <span class="text-[14px] leading-[20px] text-[#374151]">{{item.title}}</span>
                </div>
              </sc-select-option>
            </sc-select>
          </div>
          <div>
            <Label for="name">Only Formatted PhoneNumber</Label>
            <sc-phone-input [required]="true" dataType="NumberOnly" [(ngModel)]="numberInput" (ngModelChange)="phoneEvent($event)"/>
          </div>
          <div>
            <sc-input name="search" [readOnly]="true" [required]="true" [placeholder]="'Search'"/>
          </div>
          <div>
            <sc-input inputGroup groupPosition="suffix" type="password" [required]="true" [placeholder]="'Password'"/>
          </div>
          <div>
            <Label for="name">Name</Label>
            <sc-input id="name" [required]="true" [placeholder]="'First Name'"/>
          </div>
          <div>
            <Label for="lastName">Last Name</Label>
            <sc-input id="lastName" [required]="true" [invalid]="true" [touched]="true" [placeholder]="'Last Name'"/>
          </div>
          <div>
            <Label for="lastName">Last Name</Label>
            <sc-textarea-input [required]="true" [touched]="true" [invalid]="true"/>
          </div>
        </div>
      </div>
      <div class="flex flex-col">
        <div class="h-full w-full flex justify-center">

        </div>
      </div>
    </div>
  </div>

</div>
